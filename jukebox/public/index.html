<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Party Jukebox</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>🎧 Party Jukebox</h1>
    <div id="status" class="status">Loading…</div>
  </header>

  <main>
    <section id="not-configured" class="card hidden">
      <p>Ask the DJ to finish setting up Apple Music before requests can be searched.</p>
    </section>

    <section id="search-section" class="card hidden">
      <h2>Request a song</h2>
      <input id="search-input" type="search" placeholder="Search for a song or artist…" autocomplete="off" />
      <ul id="search-results" class="result-list"></ul>
    </section>

    <section id="connect-section" class="card hidden">
      <p class="muted">Optional: connect Apple Music to also save requests into a real playlist.</p>
      <button id="connect-btn">Connect Apple Music</button>
    </section>

    <section class="card queue-card">
      <h2>Now queued</h2>
      <ul id="queue-list"></ul>
      <p id="empty-state" class="empty hidden">No requests yet — search above to add the first one!</p>
    </section>
  </main>

  <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
